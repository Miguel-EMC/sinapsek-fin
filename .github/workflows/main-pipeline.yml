name: Sinapsek Unified Pipeline

on:
  push:
    branches: [ main, demo ]

env:
  PROJECT_ID: sinapsek-fin
  REGION: us-central1
  TF_STATE_BUCKET: sinapsek-fin-tfstate

jobs:
  # 1. Calidad de Código (En paralelo)
  lint-and-test:
    name: Lint & Quality Checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Lint API
        run: |
          cd services/api
          pip install ruff
          ruff check .

  # 2. Infraestructura (Depende de calidad)
  infrastructure:
    name: Terraform Infrastructure
    needs: lint-and-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}
      - uses: hashicorp/setup-terraform@v3
      - name: Set Env
        run: echo "ENV=${GITHUB_REF##*/}" >> $GITHUB_ENV
      - name: Terraform Init & Apply
        working-directory: infra
        run: |
          terraform init -backend-config="bucket=${{ env.TF_STATE_BUCKET }}" -backend-config="prefix=${{ env.ENV }}"
          terraform apply -auto-approve -var="environment=${{ env.ENV }}" -var="project_id=${{ env.PROJECT_ID }}" -var="api_image_url=us-central1-docker.pkg.dev/${{ env.PROJECT_ID }}/api-repo/api-${{ env.ENV }}:${{ github.sha }}"

  # 3. Build API (En paralelo con Infra)
  build-api:
    name: Build & Push API Image
    needs: lint-and-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}
      - uses: google-github-actions/setup-gcloud@v2
      - name: Authorize Docker
        run: gcloud auth configure-docker us-central1-docker.pkg.dev
      - name: Set Env
        run: echo "ENV=${GITHUB_REF##*/}" >> $GITHUB_ENV
      - name: Cloud Build
        run: |-
          gcloud builds submit \
            --tag us-central1-docker.pkg.dev/${{ env.PROJECT_ID }}/api-repo/api-${{ env.ENV }}:${{ github.sha }} \
            services/api/

  # 4. Build Mobile (En paralelo con API e Infra)
  build-mobile:
    name: Build Mobile App
    needs: lint-and-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
      - name: Flutter Build
        working-directory: apps/mobile
        run: |
          flutter pub get
          flutter build apk --debug

  # 5. Finalización (Depende de que todo lo anterior esté listo)
  deploy-complete:
    name: Finalize Deployment
    needs: [infrastructure, build-api]
    runs-on: ubuntu-latest
    steps:
      - name: Notification
        run: echo "Despliegue de Sinapsek Fin completado con éxito."
