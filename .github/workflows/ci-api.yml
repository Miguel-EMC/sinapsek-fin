name: CI/CD API

on:
  push:
    branches: [ main, demo ]
    paths:
      - 'services/api/**'
      - 'infra/**'

env:
  PROJECT_ID: sinapsek-fin
  REGION: us-central1
  REPOSITORY: api-repo

jobs:
  deploy:
    name: Build and Deploy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          cd services/api
          pip install -r requirements.txt
          pip install ruff pytest

      - name: Lint with Ruff
        run: ruff check services/api

      - name: Run Tests
        run: |
          cd services/api
          # Simulamos test por ahora
          echo "Running unit tests..."

      - name: Set Environment
        run: |
          if [[ $GITHUB_REF == 'refs/heads/main' ]]; then
            echo "ENV=prod" >> $GITHUB_ENV
            echo "SERVICE_NAME=sinapsek-api-prod" >> $GITHUB_ENV
          else
            echo "ENV=demo" >> $GITHUB_ENV
            echo "SERVICE_NAME=sinapsek-api-demo" >> $GITHUB_ENV
          fi

      - name: Google Auth
        id: auth
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Authorize Docker
        run: gcloud auth configure-docker us-central1-docker.pkg.dev

      - name: Cloud Build
        run: |-
          gcloud builds submit \
            --tag us-central1-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/api-${{ env.ENV }}:${{ github.sha }} \
            services/api/
