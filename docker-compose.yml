services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: app_user
      POSTGRES_PASSWORD: dev_password
      POSTGRES_DB: sinapsek_dev
    ports:
      - "5442:5432"
    volumes:
      - db_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  api:
    build: ./services/api
    volumes:
      - ./services/api:/app
    ports:
      - "8000:8080"
    environment:
      DATABASE_URL: postgresql+psycopg2://app_user:dev_password@db:5432/sinapsek_dev
      SECRET_KEY: dev-secret-key-for-local-dev
      ENVIRONMENT: dev
      CORS_ORIGINS: "*"
      LOG_LEVEL: INFO
      PYTHONPATH: /app
    depends_on:
      - db
      - redis

volumes:
  db_data: