name: Deploy With Terraform

on:
  push:
    branches:
      - main
      - demo
  workflow_dispatch:

env:
  PROJECT_ID: sinapsek-fin
  REGION: us-central1

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  resolve-environment:
    name: Resolve Environment
    runs-on: ubuntu-latest
    outputs:
      deploy_env: ${{ steps.vars.outputs.deploy_env }}
      image_url: ${{ steps.vars.outputs.image_url }}
    steps:
      - name: Map branch to Terraform environment
        id: vars
        run: |
          case "${GITHUB_REF_NAME}" in
            main)
              DEPLOY_ENV="prod"
              ;;
            demo)
              DEPLOY_ENV="demo"
              ;;
            *)
              echo "Unsupported branch: ${GITHUB_REF_NAME}" >&2
              exit 1
              ;;
          esac

          IMAGE_URL="${REGION}-docker.pkg.dev/${PROJECT_ID}/api-repo/api-${DEPLOY_ENV}:${GITHUB_SHA}"

          echo "deploy_env=${DEPLOY_ENV}" >> "$GITHUB_OUTPUT"
          echo "image_url=${IMAGE_URL}" >> "$GITHUB_OUTPUT"

  quality-gate:
    name: Quality Gate
    runs-on: ubuntu-latest
    needs: resolve-environment
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Ruff
        run: pip install ruff

      - name: Lint API
        working-directory: services/api
        run: ruff check .

  terraform-bootstrap:
    name: Bootstrap Artifact Registry
    runs-on: ubuntu-latest
    needs: [resolve-environment, quality-gate]
    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform init
        working-directory: infra
        run: terraform init -backend-config="${{ needs.resolve-environment.outputs.deploy_env }}.tfbackend"

      - name: Create Artifact Registry if missing
        working-directory: infra
        run: |
          terraform apply -auto-approve \
            -target=module.iam.google_artifact_registry_repository.api_repo \
            -var="environment=${{ needs.resolve-environment.outputs.deploy_env }}" \
            -var="project_id=${{ env.PROJECT_ID }}" \
            -var="region=${{ env.REGION }}" \
            -var="api_image_url=${{ needs.resolve-environment.outputs.image_url }}"

  build-api:
    name: Build and Push API Image
    runs-on: ubuntu-latest
    needs: [resolve-environment, terraform-bootstrap]
    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2

      - name: Authorize Docker
        run: gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev --quiet

      - name: Build image with Cloud Build
        run: |
          gcloud builds submit \
            --tag "${{ needs.resolve-environment.outputs.image_url }}" \
            services/api

  terraform-deploy:
    name: Terraform Apply
    runs-on: ubuntu-latest
    needs: [resolve-environment, build-api]
    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform init
        working-directory: infra
        run: terraform init -backend-config="${{ needs.resolve-environment.outputs.deploy_env }}.tfbackend"

      - name: Terraform validate
        working-directory: infra
        run: terraform validate

      - name: Terraform apply
        working-directory: infra
        run: |
          terraform apply -auto-approve \
            -var="environment=${{ needs.resolve-environment.outputs.deploy_env }}" \
            -var="project_id=${{ env.PROJECT_ID }}" \
            -var="region=${{ env.REGION }}" \
            -var="api_image_url=${{ needs.resolve-environment.outputs.image_url }}"

  deploy-summary:
    name: Deployment Summary
    runs-on: ubuntu-latest
    needs: [resolve-environment, terraform-deploy]
    steps:
      - name: Show deployment target
        run: |
          echo "Deployment completed for environment: ${{ needs.resolve-environment.outputs.deploy_env }}"
          echo "Image: ${{ needs.resolve-environment.outputs.image_url }}"
          echo "Migrations: executed via Terraform"
