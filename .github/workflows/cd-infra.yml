name: CD Infra

on:
  push:
    branches: [ main, demo ]
    paths:
      - 'infra/**'

env:
  PROJECT_ID: sinapsek-fin
  TF_STATE_BUCKET: sinapsek-fin-tfstate

jobs:
  terraform:
    name: Terraform Plan & Apply
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Google Auth
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Set Environment
        run: |
          if [[ $GITHUB_REF == 'refs/heads/main' ]]; then
            echo "ENV=prod" >> $GITHUB_ENV
          else
            echo "ENV=demo" >> $GITHUB_ENV
          fi

      - name: Terraform Format
        run: terraform fmt -check -recursive
        working-directory: infra

      - name: Terraform Init
        run: terraform init -backend-config="bucket=${{ env.TF_STATE_BUCKET }}" -backend-config="prefix=${{ env.ENV }}"
        working-directory: infra

      - name: Terraform Plan
        run: terraform plan -var="environment=${{ env.ENV }}" -var="project_id=${{ env.PROJECT_ID }}" -var="api_image_url=gcr.io/${{ env.PROJECT_ID }}/api:latest" -out=tfplan
        working-directory: infra

      - name: Terraform Apply
        if: github.event_name == 'push'
        run: terraform apply -auto-approve tfplan
        working-directory: infra
